name: run_tests

on:
  pull_request:
  push:
    branches: [main]

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  unittest:
    name: unittest (${{ matrix.os }}, ${{ matrix.test-subset.name }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The core groups run in the plain `test` environment, which installs no backend at all --
        # that is what proves the library runs without one.
        environment: [test]
        # Groups are balanced on measured cold-compile-cache time, which is what a fresh runner pays.
        # tests/test_workflow_groups.py fails if a test file is missing from every group or listed twice.
        test-subset:
          - name: attention
            paths: |
              tests/test_attention.py
          - name: layers
            paths: |
              tests/test_transformer.py
              tests/test_layers.py
              tests/test_recurrent.py
              tests/test_conv.py
              tests/test_conv_transpose.py
              tests/test_padding.py
              tests/test_pool.py
              tests/test_upsample.py
              tests/rewriting/
          - name: optim
            paths: |
              tests/optim/
          - name: models
            paths: |
              tests/test_pretrained.py
              tests/models/
          - name: rest
            paths: |
              tests/test_serialize.py
              tests/test_activations.py
              tests/test_loss.py
              tests/test_checkpoint.py
              tests/test_model.py
              tests/test_pytensorf.py
              tests/test_state.py
              tests/test_base.py
              tests/test_collect.py
              tests/test_util.py
              tests/test_workflow_groups.py
        # Windows runners are roughly twice as slow, and almost everything here is platform independent.
        # It runs one job over the parts that are not: file IO, paths, and compiling a graph to train.
        # One job per backend, each in that backend's environment. They live here rather than in
        # `test-subset` because a matrix entry cannot change `os`, and mlx needs macOS.
        include:
          - os: ubuntu-latest
            environment: jax
            test-subset:
              name: dispatch-jax
              paths: tests/dispatch/jax/
          - os: macos-15
            environment: mlx
            test-subset:
              name: dispatch-mlx
              paths: tests/dispatch/mlx/
          - os: ubuntu-latest
            environment: torch
            test-subset:
              name: dispatch-torch
              paths: tests/dispatch/pytorch/
          - os: windows-latest
            environment: test
            test-subset:
              name: smoke
              paths: |
                tests/test_checkpoint.py
                tests/test_serialize.py
                tests/optim/test_training.py

    runs-on: ${{ matrix.os }}

    env:
      TEST_SUBSET: ${{ matrix.test-subset.paths }}

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      with:
        environments: ${{ matrix.environment }}
        # Keyed on pixi.lock, so the cache turns over exactly when the environment does.
        cache: true
    - name: Cache the pytensor compile directory
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        CACHE_NUMBER: 0
      with:
        path: ~/.pytensor
        key: ${{ runner.os }}-pytensor-${{ env.CACHE_NUMBER }}-${{
          matrix.test-subset.name }}-${{ hashFiles('pixi.lock') }}
        restore-keys: |
          ${{ runner.os }}-pytensor-${{ env.CACHE_NUMBER }}-${{ matrix.test-subset.name }}-

    - name: Run tests
      run: |
        pixi run -e ${{ matrix.environment }} pytest -vv --durations=25 --cov=pytensor_ml --cov-report=xml --no-cov-on-fail --cov-report term $TEST_SUBSET
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }} # use token for more robust uploads
        env_vars: TEST_SUBSET
        name: ${{ matrix.os }}
        fail_ci_if_error: false
        verbose: true
